@if (rows().length === 0) {
  <app-empty-state variant="users" subtitle="No engineer assignments in the current scope." />
} @else {
  <p-table
    [value]="rows()"
    [scrollable]="true"
    scrollHeight="440px"
    stripedRows
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="min-width:200px">Engineer</th>
        <th class="num-col">Total</th>
        <th class="num-col">Active</th>
        <th class="num-col">Done</th>
        <th class="num-col">Hold</th>
        <th class="num-col">Delayed</th>
        <th class="num-col">Not Filled</th>
        <th style="min-width:200px">Progress</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-r>
      <tr>
        <td>
          <div class="eng-cell">
            <div class="av" [style.background]="avatarBg(r)">{{ r.initials }}</div>
            <div class="eng-body">
              <div class="eng-name">{{ r.name }}</div>
              <div class="eng-health" [style.color]="healthColor(r)">
                <span class="dot" [style.background]="healthColor(r)"></span>
                {{ healthLabel(r) }}
              </div>
            </div>
          </div>
        </td>
        <td class="num-col">
          <span class="badge badge-gray">{{ r.total }}</span>
        </td>
        <td class="num-col">
          <span class="badge badge-blue">{{ r.active }}</span>
        </td>
        <td class="num-col">
          <span class="badge badge-green">{{ r.done }}</span>
        </td>
        <td class="num-col">
          <span class="badge badge-amber">{{ r.hold }}</span>
        </td>
        <td class="num-col">
          <span
            class="badge"
            [class.badge-red]="r.delayed > 0"
            [class.badge-gray]="r.delayed === 0"
          >{{ r.delayed }}</span>
        </td>
        <td class="num-col">
          <span
            class="badge"
            [class.badge-violet]="r.notFilled > 0"
            [class.badge-gray]="r.notFilled === 0"
          >{{ r.notFilled }}</span>
        </td>
        <td>
          <div class="prog-wrap">
            <div class="prog-track">
              <span class="prog-seg seg-done" [style.width.%]="pct(r.done, r.total)"></span>
              <span class="prog-seg seg-active" [style.width.%]="pct(r.active, r.total)"></span>
              <span class="prog-seg seg-hold" [style.width.%]="pct(r.hold, r.total)"></span>
            </div>
            <span class="prog-pct">{{ r.progressPct }}%</span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
}
