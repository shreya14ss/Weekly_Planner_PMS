<!-- Sticky filter + tab shell -->
<div class="dash-sticky">
  <section class="filter-bar">
    <p-select
      inputId="dfClient"
      [options]="clientOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="filter.client()"
      (ngModelChange)="filter.client.set($event); filter.tl.set('all')"
      placeholder="All Clients"
      class="filter-sel"
      appendTo="body"
    />

    <p-select
      inputId="dfTl"
      [options]="tlOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="filter.tl()"
      (ngModelChange)="filter.tl.set($event)"
      [filter]="true"
      filterBy="label"
      placeholder="All TLs / Engineers"
      class="filter-sel"
      appendTo="body"
    />

    <p-select
      inputId="dfStatus"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="filter.status()"
      (ngModelChange)="filter.status.set($event)"
      placeholder="All Status"
      class="filter-sel"
      appendTo="body"
    />

    @if (hasAnyFilter()) {
      <p-button
        label="Reset"
        icon="pi pi-refresh"
        severity="secondary"
        [text]="true"
        size="small"
        (onClick)="reset()"
      />
    }

    <div class="filter-count">
      <i class="pi pi-eye text-slate-400"></i>
      {{ kpis().total }} project{{ kpis().total === 1 ? '' : 's' }} in scope
    </div>
  </section>

  <!-- Mini-nav + priority strip in a single sticky row -->
  <div class="nav-row">
    <nav class="mini-nav" aria-label="Dashboard sections">
      @for (tab of tabs; track tab.path) {
        <a
          class="mini-tab"
          [routerLink]="tab.path"
          routerLinkActive="mini-tab--active"
        >
          <i class="pi" [class]="tab.icon" aria-hidden="true"></i>
          {{ tab.label }}
        </a>
      }
    </nav>
    @if (!loading()) {
      <app-priority-strip
        class="nav-strip"
        [kpis]="kpis()"
        [activeStatus]="filter.status()"
        [compact]="true"
        (filter)="applyStatusFilter($event)"
      />
    }
  </div>
</div>

<router-outlet />

<!-- Shared project-detail modal — every view's `openProject` call pops this. -->
<app-project-detail-modal
  [(visible)]="state.detailOpen"
  [projectId]="state.detailProjectId()"
  (open)="navigateToProject($event)"
/>
