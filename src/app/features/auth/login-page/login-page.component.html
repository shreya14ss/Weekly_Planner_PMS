<div class="login-shell">
  <div class="login-card">
    <!-- Product hero -->
    <div class="login-hero">
      <div class="login-wordmark">
        Setpoint<span class="login-wordmark-dot" aria-hidden="true">.</span>
      </div>
      <div class="login-by-line">
        <!-- <img src="rbh-logo.png" alt="" class="h-4 w-auto block object-contain" /> -->
          <span>by <b>RBH Solutions</b></span>
      </div>
      <div class="login-tagline">Weekly SCADA Project Tracker</div>
    </div>

    <div class="login-divider" role="presentation"></div>

    <!-- Sign-in section -->
    <h1 class="text-[20px] font-extrabold text-rbh-navy leading-tight">Sign In</h1>
    <p class="text-[13px] text-slate-500 mt-1 mb-6">
      Select your name and enter your PIN to continue.
    </p>

    <!-- Name -->
    <label
      for="loginUser"
      class="block text-[11px] font-bold tracking-[0.09em] uppercase text-slate-500 mb-2"
    >
      Your Name
    </label>
    <p-select
      inputId="loginUser"
      [options]="userOptions()"
      optionLabel="label"
      optionValue="id"
      placeholder="Select your name…"
      [ngModel]="selectedUserId()"
      (ngModelChange)="selectedUserId.set($event)"
      class="login-select mb-5"
      [filter]="true"
      filterBy="label"
      appendTo="body"
    />

    <!-- PIN -->
    <label
      for="loginPin"
      class="block text-[11px] font-bold tracking-[0.09em] uppercase text-slate-500 mb-2"
    >
      PIN (4 digits)
    </label>
    <div id="loginPin" class="mb-6">
      <p-input-otp
        [ngModel]="pin()"
        (ngModelChange)="pin.set($event)"
        [integerOnly]="true"
        [length]="4"
        [mask]="true"
      />
    </div>

    <p-button
      label="Sign In"
      icon="pi pi-arrow-right"
      iconPos="right"
      [loading]="submitting()"
      [disabled]="!canSubmit()"
      class="w-full block"
      severity="primary"
      size="large"
      (onClick)="submit()"
    />

    @if (error()) {
      <p-message severity="error" class="w-full mt-4 block">{{ error() }}</p-message>
    }

    <!-- Helper hint
    <div class="hint">
      <i class="pi pi-info-circle text-sky-600 mt-0.5"></i>
      <div>
        <b class="text-sky-800">First time?</b> Default PIN for
        <b>Project Manager</b> is <span class="pin-badge">0000</span>, for everyone else it's
        <span class="pin-badge">1234</span>. Change your PIN after signing in.
      </div>
    </div> -->

    <!-- Footer -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <div class="text-[10.5px] text-slate-400 tracking-wide">
        RBH Solutions Pvt. Ltd. &nbsp;·&nbsp; SCO 06, Urban Estate, Phase 2, Patiala
      </div>
      <div class="text-[10.5px] text-slate-400 mt-1">
        Technology-driven Automation &amp; Control Solutions
      </div>
    </div>
  </div>
</div>
