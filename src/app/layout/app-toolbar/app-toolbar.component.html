<div class="toolbar">
  <!-- Left group: create / import / export -->
  <div class="grp">
    @if (auth.isPM() || auth.isTL()) {
      <p-button
        icon="pi pi-plus"
        label="Add Project"
        severity="primary"
        size="small"
        (onClick)="actions.openAddProject()"
      />
    }
    @if (auth.isPM()) {
      <p-button
        icon="pi pi-upload"
        label="Import Excel"
        severity="secondary"
        size="small"
        [outlined]="true"
        pTooltip="Import projects, users, or the full Firebase export"
        tooltipPosition="bottom"
        (onClick)="openImport()"
      />
    }
    <p-button
      icon="pi pi-list"
      label="Export List"
      severity="secondary"
      size="small"
      [outlined]="true"
      pTooltip="Download the project directory as Excel"
      tooltipPosition="bottom"
      [disabled]="!hasProjects()"
      (onClick)="exportList()"
    />
    @if (auth.isPM()) {
      <p-button
        icon="pi pi-save"
        label="Save &amp; Export File"
        severity="success"
        size="small"
        pTooltip="Download a portable JSON snapshot of all data — re-importable via Import Excel"
        tooltipPosition="bottom"
        (onClick)="exportBackup()"
      />
    }
  </div>

  <!-- Right group: report / recover -->
  <div class="grp">
    <p-button
      icon="pi pi-download"
      label="Excel Report"
      severity="success"
      size="small"
      [outlined]="true"
      pTooltip="Download the current week as a full spreadsheet"
      tooltipPosition="bottom"
      [disabled]="!hasProjects()"
      (onClick)="exportReport()"
    />
    <p-button
      icon="pi pi-history"
      label="Recover Tasks"
      severity="secondary"
      size="small"
      [outlined]="true"
      pTooltip="Browse every stored week and jump back to it"
      tooltipPosition="bottom"
      (onClick)="actions.openRecovery()"
    />
  </div>
</div>
